# Calls the real model, so it costs money: manual only. Add a `schedule:`
# trigger once there's budget for nightly runs.
name: Live evals

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per scenario"
        default: "3"
      model:
        description: "Model under test (blank = app default)"
        default: ""

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m evals.run_evals --runs "${{ inputs.runs }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MWALIMU_MODEL: ${{ inputs.model }}
